version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: devcraft-db
    environment:
      POSTGRES_USER: devcraft
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: devcraft_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  pgadmin:
    image: dpage/pgadmin4
    container_name: devcraft-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@devcraft.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
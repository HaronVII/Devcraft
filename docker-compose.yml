version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: devcraft-db
    environment:
      POSTGRES_USER: devcraft
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: devcraft_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: